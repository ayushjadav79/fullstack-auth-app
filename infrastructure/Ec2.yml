AWSTemplateFormatVersion: '2010-09-09'
Description: Procure a t3.micro EC2

# Defining parameters to be referenced
Parameters:
  CurrentSecurityGroupId:
    Type: String
    Description: Security Group ID passed from Github Secrets
  PostgresPassword:
    Type: String
    NoEcho: true # This hides the password in AWS logs

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-019715e0d74f695be  # AMI image of Ubuntu 24.04
      KeyName: login                  # Existing .pem file name
      SecurityGroupIds:
        - !Ref CurrentSecurityGroupId        # From Github secrets
      Tags:
        - Key: Name
          Value: Project-Server-Develop   # Name of EC2
      
